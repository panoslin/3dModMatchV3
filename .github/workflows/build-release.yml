name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft Release after build'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Required if creating a release.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon (ARM)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Eigen3
        run: brew install eigen

      - name: Build macOS app
        run: bash scripts/build-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop-app/dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure CMake is available
        shell: pwsh
        run: cmake --version

      - name: Build Windows app
        shell: pwsh
        run: scripts\build-win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop-app/dist/*.exe

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f \( -name '*.dmg' -o -name '*.exe' \) | head -20

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.release_tag || format('v{0}', github.run_number) }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          draft: true
          generate_release_notes: true
          files: |
            macos-dmg/*.dmg
            windows-installer/*.exe
